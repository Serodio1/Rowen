# Dependabot opens a pull request when a new version comes out of an action
# the workflows use, of an image the Dockerfiles start from, or of a package
# in frontend/package-lock.json or backend/uv.lock. All are pinned (by SHA,
# digest or lock file), so nothing changes until such a pull request is
# merged, after CI has tested it.
#
# Once a month, with one pull request for each kind, and only versions out
# for 14 days, as for npm (frontend/.npmrc, min-release-age): a version
# that was broken or malicious has usually been found and pulled by then.
# New major versions are left out: each is a choice of its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
    ignore:
      # A new major version (Node 26, say) is a choice of its own, with the
      # rest of the project (frontend/.nvmrc, backend/pyproject.toml).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
