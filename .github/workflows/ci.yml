name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A button on the Actions tab, to run CI and the deployment again.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each branch. On a pull request, a new push cancels the
# run that is still in progress. On main, a run never stops halfway through a
# deployment: a new one waits, and a waiting run makes way for a newer one, so
# the last commit is always deployed last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A job that hangs is stopped after this long, not after GitHub's six
    # hours. Each job takes a few minutes.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # A PostgreSQL of its own, for the tests of the store in PostgreSQL
    # (backend/tests/conftest.py). The job's steps start once it is ready.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      # The engine, the AI, the CLI and the API may only import what
      # pyproject.toml allows.
      - name: Check imports
        run: uv run lint-imports

      # With the database, every test runs: one skipped would leave lines
      # untested, and coverage below 100% fails the step.
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/postgres
        run: uv run pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Also turns ESLint errors into annotations on the PR. TypeScript errors
      # are only in the log: tsc prints paths relative to frontend/, which
      # GitHub cannot place in the files.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it
      # is out of date with package.json.
      - name: Install dependencies
        run: npm ci

      # The API's types must be the ones generated from backend/openapi.json,
      # which a backend test checks against the API. The generator writes the
      # file again even if it was deleted, so first check that git has it.
      - name: Check API types
        run: |
          git ls-files --error-unmatch src/api/schema.d.ts
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      # --wait returns once the API's health check passes and nginx runs.
      - name: Start the game
        run: docker compose up --detach --wait

      # A whole match in a real browser (frontend/e2e), against the game just
      # started. Before the Smoke test, which ends by using up nginx's limits.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Playwright's own Chromium, with the system libraries it needs.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test in the browser
        working-directory: frontend
        run: npm run test:e2e

      # What the browser showed at each step of a test that failed: open the
      # report with `npx playwright show-report <folder>`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      # Through nginx, as the browser does: the page with its security headers,
      # its JavaScript with nosniff, a redirect that names only the path (as
      # behind Cloud Run), the API's docs under /api, the decks, then a whole
      # match (at most 100 moves), always playing the first legal move with the
      # match's version, read back at the end, and then the first move again,
      # which comes too late: 409. The API then restarts (nginx with it), and
      # the match is still there, kept in PostgreSQL. A move every quarter of a
      # second stays under nginx's limit of 5 requests a second. Then, that the
      # API ignores an address a visitor writes in X-Forwarded-For. Then an
      # account, as the page makes it (with its Origin): logged in, a match of
      # its own, in its list (and none older than it, so nginx passes the
      # query on), out of a guest's reach (404), no stats yet, a log out from
      # another site turned down (403), a log out, and the old cookie worth
      # nothing. Last, nginx's limits (they use up the buckets, so they
      # come last): a request over 16 KB, for a new match and for a move, new
      # matches in a row, each with another address in X-Forwarded-For, until
      # nginx answers 429 with its error, logins with a wrong password in a
      # row, the same way, and then requests for the decks in a row, until the
      # same 429.
      # The first request tries again for a few seconds, in case nginx is not
      # listening yet.
      - name: Smoke test
        run: |
          url=http://localhost:8080
          js=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 "$url/" | grep --only-matching '/assets/[^"]*\.js')
          curl --fail --silent --show-error --head "$url$js" | grep --quiet --ignore-case 'x-content-type-options: nosniff'
          page=$(curl --fail --silent --show-error --head "$url/")
          grep --quiet --ignore-case "content-security-policy: default-src 'self'" <<< "$page"
          grep --quiet --ignore-case "frame-ancestors 'none'" <<< "$page"
          grep --quiet --ignore-case 'x-content-type-options: nosniff' <<< "$page"
          curl --silent --show-error --head "$url/assets" | grep --quiet --ignore-case '^location: /assets/'
          curl --fail --silent --show-error "$url/api/docs" | grep --quiet "'/api/openapi.json'"
          curl --fail --silent --show-error --output /dev/null "$url/api/openapi.json"
          curl --fail --silent --show-error "$url/api/decks" | grep --quiet '"humans"'
          match=$(curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"deck": "humans"}' "$url/api/matches")
          id=$(jq --raw-output .id <<< "$match")
          first=$(jq --compact-output '{version, action: .view.legal_actions[0]}' <<< "$match")
          for n in $(seq 100); do
            jq --exit-status .view.match_over <<< "$match" > /dev/null && break
            move=$(jq --compact-output '{version, action: .view.legal_actions[0]}' <<< "$match")
            match=$(curl --fail --silent --show-error --header 'Content-Type: application/json' \
              --data "$move" "$url/api/matches/$id/actions")
            sleep 0.25
          done
          curl --fail --silent --show-error "$url/api/matches/$id" | jq --exit-status .view.match_over
          answer=$(curl --silent --show-error --write-out '\n%{http_code}' --header 'Content-Type: application/json' \
            --data "$first" "$url/api/matches/$id/actions")
          [ "$(tail --lines 1 <<< "$answer")" = 409 ]
          head --lines 1 <<< "$answer" | jq --exit-status '.code == "match_changed"'
          version=$(jq .version <<< "$match")
          docker compose restart api
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 "$url/api/matches/$id" \
            | jq --exit-status ".version == $version and .view.match_over"
          curl --fail --silent --show-error --output /dev/null --header 'X-Forwarded-For: 203.0.113.9' "$url/api/decks"
          if docker compose logs api | grep --quiet 203.0.113.9; then
            echo "The API took the address in X-Forwarded-For"; exit 1
          fi
          jar=$(mktemp)
          account="{\"username\": \"smoke$(date +%s)\", \"password\": \"smoke test password\"}"
          curl --fail --silent --show-error --cookie-jar "$jar" --header 'Content-Type: application/json' \
            --header "Origin: $url" --data "$account" "$url/api/accounts" | jq --exit-status '.username | startswith("smoke")'
          curl --fail --silent --show-error --cookie "$jar" "$url/api/session" | jq --exit-status '.username | startswith("smoke")'
          mine=$(curl --fail --silent --show-error --cookie "$jar" --header 'Content-Type: application/json' \
            --header "Origin: $url" --data '{"deck": "robots"}' "$url/api/matches" | jq --raw-output .id)
          curl --fail --silent --show-error --cookie "$jar" "$url/api/matches" \
            | jq --exit-status ".matches[0].id == \"$mine\" and .matches[0].result == null"
          curl --fail --silent --show-error --cookie "$jar" "$url/api/matches?before=$mine" | jq --exit-status '.matches == []'
          [ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url/api/matches/$mine")" = 404 ]
          curl --fail --silent --show-error --cookie "$jar" "$url/api/stats" | jq --exit-status '.decks == []'
          answer=$(curl --silent --show-error --write-out '\n%{http_code}' --cookie "$jar" \
            --header 'Origin: https://evil.example' --request DELETE "$url/api/session")
          [ "$(tail --lines 1 <<< "$answer")" = 403 ]
          head --lines 1 <<< "$answer" | jq --exit-status '.code == "forbidden_origin"'
          cp "$jar" "$jar.old"
          curl --fail --silent --show-error --cookie "$jar" --cookie-jar "$jar" --header "Origin: $url" \
            --request DELETE "$url/api/session"
          [ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --cookie "$jar.old" "$url/api/session")" = 401 ]
          for path in matches "matches/$id/actions"; do
            head --bytes 20000 /dev/zero | curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data-binary @- "$url/api/$path" | grep --quiet '^413$'
          done
          for n in $(seq 10); do
            answer=$(curl --silent --show-error --write-out '\n%{http_code}' --header 'Content-Type: application/json' \
              --header "X-Forwarded-For: 203.0.113.$n" --data '{"deck": "humans"}' "$url/api/matches")
            [ "$(tail --lines 1 <<< "$answer")" = 429 ] && break
          done
          [ "$(tail --lines 1 <<< "$answer")" = 429 ]
          head --lines 1 <<< "$answer" | jq --exit-status '.code == "too_many_requests" and (.message | type) == "string"'
          for n in $(seq 10); do
            answer=$(curl --silent --show-error --write-out '\n%{http_code}' --header 'Content-Type: application/json' \
              --header "X-Forwarded-For: 203.0.113.$n" --data '{"username": "nobody", "password": "wrong password"}' \
              "$url/api/session")
            [ "$(tail --lines 1 <<< "$answer")" = 429 ] && break
            [ "$(tail --lines 1 <<< "$answer")" = 401 ]
          done
          [ "$(tail --lines 1 <<< "$answer")" = 429 ]
          head --lines 1 <<< "$answer" | jq --exit-status '.code == "too_many_requests" and (.message | type) == "string"'
          for n in $(seq 40); do
            answer=$(curl --silent --show-error --write-out '\n%{http_code}' "$url/api/decks")
            [ "$(tail --lines 1 <<< "$answer")" = 429 ] && break
          done
          [ "$(tail --lines 1 <<< "$answer")" = 429 ]
          head --lines 1 <<< "$answer" | jq --exit-status '.code == "too_many_requests" and (.message | type) == "string"'

      # Each container's state and health, then what they printed.
      - name: Show the logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs

  # Online, after the three jobs above pass on main: the same steps as
  # docs/deploy.md, signed in to Google with no stored key (ADR 0012).
  deploy:
    name: Deploy
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only main may use this environment (its rule on GitHub), and Google only
    # trusts jobs that run in it. Its variables say which project and account.
    environment:
      name: production
      url: ${{ steps.check.outputs.url }}
    permissions:
      contents: read
      # Lets the job ask GitHub for a signed token that says which repository,
      # branch and environment it runs for. Google checks it instead of a key.
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rowen
    steps:
      - uses: actions/checkout@v7

      # Built before signing in, so no image can hold the credentials.
      - name: Build images
        run: |
          tag=$(git rev-parse --short HEAD)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build --platform=linux/amd64 --provenance=false --tag "$REGISTRY/api:$tag" backend
          docker build --platform=linux/amd64 --provenance=false --tag "$REGISTRY/web:$tag" frontend

      # Trades GitHub's token for an hour of access as the account
      # rowen-deploy, which may only push images and update the service.
      # gcloud, already on the runner, uses it in the next steps.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Push images
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$REGISTRY/api:$TAG"
          docker push "$REGISTRY/web:$TAG"

      # Brings the database's tables up to date, as the database's owner (a
      # secret of the environment), before the new revision starts: if a
      # migration fails, nothing is deployed. The revision still running
      # meets the new tables for a moment, so a migration must not break it
      # (add, then remove in a later deployment).
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend
          enable-cache: true

      - name: Migrate the database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: uv run --locked --no-dev alembic upgrade head

      # Starts the new revision beside the one that answers now, which keeps
      # all the requests (ADR 0016). Fails if its containers do not start.
      - name: Deploy
        run: |
          serving=$(gcloud run services describe rowen --region=europe-west1 --format=json \
            | jq --raw-output --exit-status '.status.traffic[] | select(.percent == 100) | .revisionName')
          sed -e "s/PROJECT_ID/$PROJECT_ID/g" -e "s/IMAGE_TAG/$TAG/g" -e "s/SERVING_REVISION/$serving/g" \
            deploy/cloud-run.yaml > "$RUNNER_TEMP/rowen-run.yaml"
          gcloud run services replace "$RUNNER_TEMP/rowen-run.yaml" --region=europe-west1

      # The new revision answers at its own address: the page with its
      # security header, the decks through nginx, then a new match, read back
      # from the database (one new match of the runner's own limit). The first
      # request tries again for a while, in case the instance is still
      # starting. If any of this fails, the visitors never meet the revision.
      - name: Check the new revision
        run: |
          url=$(gcloud run services describe rowen --region=europe-west1 --format=json \
            | jq --raw-output --exit-status '.status.traffic[] | select(.tag == "candidate") | .url')
          page=$(curl --fail --silent --show-error --head --retry 5 --retry-all-errors --retry-delay 3 "$url/")
          grep --quiet --ignore-case "content-security-policy: default-src 'self'" <<< "$page"
          curl --fail --silent --show-error "$url/api/decks" | grep --quiet '"humans"'
          match=$(curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"deck": "humans"}' "$url/api/matches")
          id=$(jq --raw-output .id <<< "$match")
          curl --fail --silent --show-error "$url/api/matches/$id" | jq --exit-status '.version == 1'

      # Only now do the visitors' requests go to the new revision, and the
      # game's own address must still answer with the page.
      - name: Move the traffic
        id: check
        run: |
          gcloud run services update-traffic rowen --region=europe-west1 --to-revisions="rowen-$TAG=100"
          url=$(gcloud run services describe rowen --region=europe-west1 --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --head "$url/" > /dev/null
