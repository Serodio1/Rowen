name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      # The engine, the AI, the CLI and the API may only import what
      # pyproject.toml allows.
      - name: Check imports
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Also turns ESLint errors into annotations on the PR. TypeScript errors
      # are only in the log: tsc prints paths relative to frontend/, which
      # GitHub cannot place in the files.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it
      # is out of date with package.json.
      - name: Install dependencies
        run: npm ci

      # The API's types must be the ones generated from backend/openapi.json,
      # which a backend test checks against the API. The generator writes the
      # file again even if it was deleted, so first check that git has it.
      - name: Check API types
        run: |
          git ls-files --error-unmatch src/api/schema.d.ts
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
