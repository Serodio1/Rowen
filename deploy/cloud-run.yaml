# The game on Google Cloud Run: one service, "rowen", with two containers that
# run side by side on the same instance and share its network (ADR 0010).
# docs/deploy.md says how to deploy it: PROJECT_ID and IMAGE_TAG are replaced
# by the project's ID and the commit the images were built from,
# SERVING_REVISION by the revision that gets the requests now, then
#   gcloud run services replace <the file> --region europe-west1
# The new revision gets no requests until it is checked at its own address
# and the traffic is moved to it (ADR 0016).
# Field reference: https://cloud.google.com/run/docs/reference/yaml/v1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rowen
spec:
  template:
    metadata:
      # The revision is named after the commit, so the traffic below can
      # point at it. (A name must start with the service's.)
      name: rowen-IMAGE_TAG
      annotations:
        # At most one instance: it caps what the service can cost, and one
        # is plenty for this game. (The matches are in the database, so a
        # second instance would know them too.)
        autoscaling.knative.dev/maxScale: "1"
        # CPU only while a request is being answered (request-based billing),
        # so idle time is not billed. Between requests the instance gets no
        # CPU, and after up to 15 idle minutes it is stopped (the matches are
        # in the database, so none is lost).
        run.googleapis.com/cpu-throttling: "true"
        # nginx starts only after the API's startup probe passes, so it never
        # passes on requests to an API that is not listening yet.
        run.googleapis.com/container-dependencies: '{"web": ["api"]}'
    spec:
      # The service's own identity, with no roles: the game calls no other
      # Google service. docs/deploy.md creates it.
      serviceAccountName: rowen-run@PROJECT_ID.iam.gserviceaccount.com
      # Up to 80 requests at once, said here since the default depends on the
      # CPU, and with 1 a page that asks for two things at once would wait.
      containerConcurrency: 80
      containers:
        # nginx with the page (frontend/Dockerfile): the only container that
        # receives the requests from the internet, on port 8080. It passes
        # /api/ on to the API on 127.0.0.1:8000 (frontend/nginx.conf).
        - name: web
          image: europe-west1-docker.pkg.dev/PROJECT_ID/rowen/web:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 1
            failureThreshold: 30
        # The web API (backend/Dockerfile). Cloud Run does not run Docker's
        # HEALTHCHECK, so this probe asks the same /decks.
        - name: api
          image: europe-west1-docker.pkg.dev/PROJECT_ID/rowen/api:IMAGE_TAG
          # The database's address, with the password of the role the API
          # connects as, from Secret Manager (docs/deploy.md): never in this
          # file. Read when an instance starts.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rowen-database-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /decks
              port: 8000
            periodSeconds: 1
            failureThreshold: 30
  # The revision that answers now keeps all the requests. The new one gets
  # none, and the tag "candidate" gives it an address of its own,
  # https://candidate---<the service's address>, to be checked at.
  traffic:
    - revisionName: SERVING_REVISION
      percent: 100
    - revisionName: rowen-IMAGE_TAG
      tag: candidate
      percent: 0
