[project]
name = "rowen"
version = "0.1.0"
description = "Rules engine and API for Rowen, a turn-based card game."
license = "MIT"
authors = [{ name = "Rui Vasconcelos" }]
requires-python = ">=3.14"
dependencies = []

# The commands the package installs: "uv run rowen" plays a match in the terminal.
[project.scripts]
rowen = "rowen.cli.play:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "B",   # likely bugs (flake8-bugbear)
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "PT",  # pytest style
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["rowen"]
branch = true

[tool.coverage.report]
show_missing = true
# Every line and branch must be tested. A line that can't be reached carries
# "# pragma: no branch" or "# pragma: no cover", with a comment saying why.
fail_under = 100

[tool.importlinter]
root_packages = ["rowen"]
# Also track imports of packages outside rowen, standard library included.
include_external_packages = true

# ADR 0003: the engine is pure. Outside rowen.engine it may only import the
# standard library modules allowed below, none of which does I/O or reads the
# clock. Everything else is forbidden, third-party packages included.
[[tool.importlinter.contracts]]
name = "The engine only imports allowed standard library modules"
type = "forbidden"
source_modules = ["rowen.engine"]
# "*" is every top-level package: the standard library and third-party ones.
forbidden_modules = ["*", "rowen.ai", "rowen.api", "rowen.cli", "rowen.data", "rowen.db"]
# The allowed modules. Import-linter has no allow list, so they are written as
# imports to ignore. A module listed here that the engine stops using is an
# error, so the list always matches the code.
ignore_imports = [
    "rowen.engine.** -> collections",
    "rowen.engine.** -> dataclasses",
    "rowen.engine.** -> enum",
    "rowen.engine.** -> random",
]
broken_contract_guidance = """
The engine must stay pure (ADR 0003). If the code needs another standard library
module that does no I/O and doesn't read the clock, add it to ignore_imports in
pyproject.toml. Otherwise, the code belongs outside rowen.engine."""

# ADR 0003: the AI only plays through the engine, as a human player does. It
# may import rowen.engine and nothing else: no other part of rowen, no
# third-party package and no standard library module. As above, what is
# allowed is written as imports to ignore.
[[tool.importlinter.contracts]]
name = "The AI only imports the engine"
type = "forbidden"
source_modules = ["rowen.ai"]
# Every top-level package, and every other part of rowen.
forbidden_modules = ["*", "rowen.*"]
# The only imports allowed: the engine's modules.
ignore_imports = ["rowen.ai.** -> rowen.engine.**"]
broken_contract_guidance = """
The AI may only import the engine (ADR 0003), so it sees a match only through
its player view, as a human player does. If the code needs a standard library
module that does no I/O and doesn't read the clock, add it to ignore_imports in
pyproject.toml."""

# ADR 0002: the CLI holds no rules. It shows the player view and passes the
# player's choice to the engine. So it may only import the parts of the engine
# allowed below: what cards, actions and events are, the player view, and the
# game module, for starting a match and applying an action. The game module
# also holds the rules, such as legal_actions; the contract can't keep the
# CLI from calling them, so that is left to review. The CLI may also import
# the AI and the card data, which use the engine themselves. The standard
# library and third-party packages are fine: reading and printing is the
# CLI's job.
[[tool.importlinter.contracts]]
name = "The CLI only imports the allowed parts of the engine"
type = "forbidden"
source_modules = ["rowen.cli"]
forbidden_modules = ["rowen.engine.*"]
# The allowed imports, written as imports to ignore, as above. What an allowed
# module imports doesn't count against the CLI.
ignore_imports = [
    "rowen.cli.** -> rowen.engine.actions",
    "rowen.cli.** -> rowen.engine.cards",
    "rowen.cli.** -> rowen.engine.events",
    "rowen.cli.** -> rowen.engine.game",
    "rowen.cli.** -> rowen.engine.view",
    "rowen.cli.** -> rowen.ai.baseline",
    "rowen.cli.** -> rowen.data",
]
broken_contract_guidance = """
The CLI holds no rules (ADR 0002): what it shows comes from the player view,
which the engine works out. If the CLI needs an engine module that holds no
rules, add it to ignore_imports in pyproject.toml. Otherwise, what the CLI
needs belongs in the player view."""
