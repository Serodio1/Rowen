[project]
name = "rowen"
version = "0.0.0"
description = "Rules engine and API for Rowen, a turn-based card game."
license = "MIT"
authors = [{ name = "Rui Vasconcelos" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "B",   # likely bugs (flake8-bugbear)
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "PT",  # pytest style
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["rowen"]
branch = true

[tool.coverage.report]
show_missing = true
