# Alembic's settings: the migrations that make and change the database's
# tables, in migrations/versions. Run in backend:
#   uv run alembic upgrade head   brings the database at DATABASE_URL up to date
#   uv run alembic check          fails if the models (rowen.api.database) and
#                                 the migrations no longer make the same tables
#   uv run alembic revision --autogenerate -m "..."   writes a new migration
#                                 from what changed in the models, against a
#                                 database that is up to date; read it before
#                                 committing it (it can't see every change,
#                                 such as a CHECK constraint)
# The database's address is never written here: it comes from DATABASE_URL
# (migrations/env.py), since it holds a password.

[alembic]
script_location = %(here)s/migrations
path_separator = os
# New migrations are named after the date, then what they do.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

# Each new migration goes through ruff, so it passes CI's Lint and Check
# formatting as it is.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

# Alembic says which migrations it runs.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
