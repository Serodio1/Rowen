# nginx serves the built page and passes the page's requests for /api/ on to
# the web API, as the development server does (vite.config.ts). The page and
# the API have the same address, so the API needs no CORS (ADR 0009).

# Limits on the API's requests, per visitor's address (ADR 0011): a "bucket"
# per address, which refills at the given rate. 1 MB of memory per zone keeps
# about 8,000 addresses; when it is full, the ones unused the longest go.
# - api: all requests to /api/, 5 a second, against floods that would burn
#   the CPU (and reach the spending cap, which pauses the game).
# - new_matches: new matches, 10 a minute, so that no one can fill the
#   database with matches or keep the CPU busy making them.
# - logins: logging in and making accounts, 5 a minute, so that nobody can
#   guess a password by trying many quickly (ADR 0014).
# - accounts: making accounts, 1 a minute (nginx counts no slower), so
#   that no one can fill the database with accounts quickly (each may keep
#   10 decks): at 5 a minute, one address could make about 7,000 a day; at 1,
#   about 1,400, about as much room as the new matches already allow.
# In these three, only POST counts ($posting is empty otherwise, and nginx
# doesn't count an empty key): the page asks who is logged in
# (GET /api/session) each time it opens, and for the player's matches
# (GET /api/matches) a page at a time.
limit_req_zone $visitor zone=api:1m rate=5r/s;
limit_req_zone $posting zone=new_matches:1m rate=10r/m;
limit_req_zone $posting zone=logins:1m rate=5r/m;
limit_req_zone $posting zone=accounts:1m rate=1r/m;

# Who a bucket belongs to. An IPv4 address is one visitor. With IPv6, one
# home usually gets a whole block of addresses that share their first 64 bits
# (a /64), and can send each request from another one, so the block is the
# visitor. The address is read as nginx keeps it, in bytes (16 for IPv6, 4
# for IPv4), not as text: the text of one block has more than one form
# ("2001:db8:1:0:5::" and "2001:db8:1::5"), and each form was a bucket.
map $binary_remote_addr $visitor {
    "~(?s)^(?<block>.{8}).{8}$" $block;
    default $binary_remote_addr;
}

map $request_method $posting {
    POST $visitor;
    default "";
}

server {
    # Without root, nginx cannot use the ports under 1024, such as 80.
    listen 8080;
    root /usr/share/nginx/html;

    # Do not say which nginx version answers.
    server_tokens off;

    # Compress text before sending it: the page's JavaScript shrinks to about
    # a third. Vary tells caches between here and the browser to keep the
    # compressed and the plain copies apart.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Redirects name only the path (Location: /assets/), not this server's
    # own address: behind Cloud Run, that would be http and port 8080, while
    # the browser uses https and port 443.
    absolute_redirect off;

    # The visitor's address. Behind Cloud Run, every request comes from
    # Google's front end, on a link-local address (169.254.x.x), which adds
    # the visitor's address at the end of X-Forwarded-For; what comes before
    # it, the visitor may have written. So from those addresses only, nginx
    # takes the last one (real_ip_recursive off). In Compose no request comes
    # from there, and the address nginx sees is the visitor's.
    set_real_ip_from 169.254.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Over a limit, a request gets 429 with an error like the API's, which
    # the page shows (too_many_requests is in the API's ErrorCode).
    limit_req_status 429;

    # The API runs next to nginx and shares its network, in Compose
    # (network_mode in compose.yaml) as in Cloud Run (deploy/cloud-run.yaml),
    # so it answers on 127.0.0.1. The / at the end leaves the /api out:
    # /api/decks reaches the API as /decks. The API gets the Host the browser
    # sent (nginx would send 127.0.0.1:8000), which it compares with Origin
    # to turn down requests from other sites (ADR 0014).
    # - limit_req: up to 20 requests at once beyond the rate (burst), answered
    #   without waiting (nodelay); a match never comes close.
    # - client_max_body_size: the largest move is under 1 KB, so a bigger
    #   request gets 413 before the API reads it.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 16k;
        error_page 429 @too_many_requests;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000/;
    }

    # A new match: the same, plus up to 5 new matches at once beyond the rate.
# The list of the player's matches (GET) has the same address.
    location = /api/matches {
        limit_req zone=api burst=20 nodelay;
        limit_req zone=new_matches burst=5 nodelay;
        client_max_body_size 16k;
        error_page 429 @too_many_requests;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000/matches;
    }

    # Logging in, and making an account (which logs in): the same, plus up to
    # 5 tries at once beyond the rate. So at most about 7,000 passwords a day
    # from one address.
    location = /api/session {
        limit_req zone=api burst=20 nodelay;
        limit_req zone=logins burst=5 nodelay;
        client_max_body_size 16k;
        error_page 429 @too_many_requests;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000/session;
    }

    # Making an account: as logging in, and then 1 a minute, plus up to 10
    # at once beyond that rate (CI makes 4 in a run).
    location = /api/accounts {
        limit_req zone=api burst=20 nodelay;
        limit_req zone=logins burst=5 nodelay;
        limit_req zone=accounts burst=10 nodelay;
        client_max_body_size 16k;
        error_page 429 @too_many_requests;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8000/accounts;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"code": "too_many_requests", "message": "Too many requests. Wait a moment and try again."}';
    }

    # Security headers for the game's page and its files. A location with an
    # add_header of its own drops the server's, so each location lists them.
    # /api/ gets none: its /api/docs page loads Swagger UI from another site.
    # - Content-Security-Policy, on the page: scripts, styles, images and
    #   requests only from this address (default-src), no plugins
    #   (object-src), no <base> tag pointing elsewhere (base-uri), forms sent
    #   only here (form-action), and no other site may show the page in a
    #   frame (frame-ancestors), against clickjacking.
    # - X-Content-Type-Options: nosniff, on the page and its files: the
    #   browser uses each file only as the type nginx sends.

    # The build puts a hash of each file's content in its name, so a file
    # under /assets/ never changes: browsers may keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # index.html names the current assets, so browsers check it every time.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
    }
}
