# nginx serves the built page and passes the page's requests for /api/ on to
# the web API, as the development server does (vite.config.ts). The page and
# the API have the same address, so the API needs no CORS (ADR 0009).
server {
    # Without root, nginx cannot use the ports under 1024, such as 80.
    listen 8080;
    root /usr/share/nginx/html;

    # Do not say which nginx version answers.
    server_tokens off;

    # Compress text before sending it: the page's JavaScript shrinks to about
    # a third. Vary tells caches between here and the browser to keep the
    # compressed and the plain copies apart.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Redirects name only the path (Location: /assets/), not this server's
    # own address: behind Cloud Run, that would be http and port 8080, while
    # the browser uses https and port 443.
    absolute_redirect off;

    # The API runs next to nginx and shares its network, in Compose
    # (network_mode in compose.yaml) as in Cloud Run (deploy/cloud-run.yaml),
    # so it answers on 127.0.0.1. The / at the end leaves the /api out:
    # /api/decks reaches the API as /decks.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    # Security headers for the game's page and its files. A location with an
    # add_header of its own drops the server's, so each location lists them.
    # /api/ gets none: its /api/docs page loads Swagger UI from another site.
    # - Content-Security-Policy, on the page: scripts, styles, images and
    #   requests only from this address (default-src), no plugins
    #   (object-src), no <base> tag pointing elsewhere (base-uri), forms sent
    #   only here (form-action), and no other site may show the page in a
    #   frame (frame-ancestors), against clickjacking.
    # - X-Content-Type-Options: nosniff, on the page and its files: the
    #   browser uses each file only as the type nginx sends.

    # The build puts a hash of each file's content in its name, so a file
    # under /assets/ never changes: browsers may keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # index.html names the current assets, so browsers check it every time.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
    }
}
