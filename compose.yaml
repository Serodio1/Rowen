# The whole game with one command: docker compose up --build, then open
# http://localhost:8080 (see the README and ADR 0009). The images are the ones
# a server would run; for development, the API and the page run without Docker.
# compose.yaml is the name Docker Compose looks for first (docker-compose.yml is
# the older one).

services:
  # PostgreSQL, where the API keeps its matches, so they survive a restart.
  # Only the other containers reach it: its port is not published. The
  # password is for this computer only; online, the database is elsewhere
  # (ADR 0013).
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rowen
      POSTGRES_PASSWORD: rowen
      POSTGRES_DB: rowen
    # The matches, kept on this computer between runs: docker compose down -v
    # deletes them.
    volumes:
      - db-data:/var/lib/postgresql
    # Ready once it takes connections.
    healthcheck:
      # On TCP, as the API connects: the first time it starts, PostgreSQL
      # listens on its socket alone for a moment, then starts again.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=rowen", "--dbname=rowen"]
      interval: 5s
      start_period: 10s
      start_interval: 1s
    # The same safer settings as the API's, below. PostgreSQL runs as its own
    # user (70, postgres), so it needs no right to change who owns a file,
    # and writes only to its data and two folders in memory.
    user: "70:70"
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Brings the database's tables up to date (backend/migrations), then stops:
  # the API starts only once it did.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://rowen:rowen@db:5432/rowen
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The web API (backend/Dockerfile). The page's nginx shares its network
  # (network_mode below), so only nginx reaches it, on 127.0.0.1:8000, as in
  # Cloud Run (deploy/cloud-run.yaml).
  api:
    build: ./backend
    # The page's port. A container that shares another's network cannot
    # publish ports, so nginx's port 8080 is published here, on the network
    # they share. Only this computer can open the page, not the others on its
    # network. The API's port 8000 is not published.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://rowen:rowen@db:5432/rowen
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Safer settings: the container's files cannot be changed, it keeps none of
    # the Linux capabilities (special rights, such as changing who owns a
    # file), and it can never gain more (no-new-privileges).
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # The page, served by nginx, which passes /api/ on to the API
  # (frontend/Dockerfile and frontend/nginx.conf).
  web:
    build: ./frontend
    # nginx runs in the API's network: for both, 127.0.0.1 is the same.
    network_mode: "service:api"
    # nginx starts once the API answers (the API's HEALTHCHECK). When
    # docker compose up (for the whole game, not only the api service)
    # replaces the API's container, its network goes with it, so nginx starts
    # again too, in the new one.
    depends_on:
      api:
        condition: service_healthy
        restart: true
    # The same safer settings as the API's.
    read_only: true
    # The only place nginx writes: its temporary files.
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  db-data:
